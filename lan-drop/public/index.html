<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#435c48"><title>LAN Drop</title><link rel="stylesheet" href="style.css"></head>
<body><main><a class="back" href="/">LAN DROP</a><p class="eyebrow">LOCAL FILE SHARING</p><h1>同じWi‑Fiで、<br><em>すぐに送る。</em></h1><p class="lead">この画面をPCとiPhoneの両方で開くと、ファイルを受け渡せます。送られたファイルはPCの「received」フォルダに保存されます。</p>
<label class="drop" id="drop-zone" for="file-input"><input id="file-input" type="file" multiple><span class="plus">＋</span><strong>ファイルを選ぶ</strong><small>写真・動画・書類をまとめて送信できます（500MBまで）</small></label><div class="upload-status" id="upload-status" aria-live="polite"></div>
<section><div class="section-title"><h2>受け取ったファイル</h2><button id="refresh">更新</button></div><ul id="file-list"><li class="loading">読み込み中…</li></ul></section>
<p class="hint">安全のため、LAN Dropは同じWi‑Fiに接続している端末からのみ利用してください。</p></main><script src="app.js"></script></body></html>
