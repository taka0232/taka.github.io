<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="毎日の小さな手間を軽くする、ブラウザで完結する便利ツール集。" />
    <title>道具箱 | すぐ使える便利ツール</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="道具箱 トップへ">
        <span class="brand-mark">道</span><span>道具箱</span>
      </a>
      <nav aria-label="メインナビゲーション">
        <a href="#tools">ツール</a>
        <a href="#about">このサイトについて</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">A SMALL COLLECTION OF USEFUL THINGS</p>
        <h1 id="hero-title">ちょっとした手間を、<br /><em>すこし軽く。</em></h1>
        <p class="hero-copy">インストール不要。思いついたときに、すぐ使える道具を置いています。</p>
        <a class="hero-link" href="#tools">道具を探す <span aria-hidden="true">↓</span></a>
        <div class="sun" aria-hidden="true"></div>
      </section>

      <section class="tools-section" id="tools" aria-labelledby="tools-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TOOLS</p>
            <h2 id="tools-title">今日の道具</h2>
          </div>
          <label class="search">
            <span class="sr-only">ツールを検索</span>
            <input id="tool-search" type="search" placeholder="ツールを検索" />
            <span aria-hidden="true">⌕</span>
          </label>
        </div>
        <div class="filters" aria-label="カテゴリで絞り込み">
          <button class="filter active" data-category="all">すべて</button>
          <button class="filter" data-category="daily">日常</button>
          <button class="filter" data-category="work">仕事・学習</button>
          <button class="filter" data-category="photo">写真</button>
        </div>
        <div class="tool-grid" id="tool-grid"></div>
        <p class="empty" id="empty-message" hidden>条件に合う道具は見つかりませんでした。</p>
      </section>

      <section class="about" id="about">
        <p class="eyebrow">ABOUT</p>
        <h2>気軽に使える、<br />小さなウェブの道具箱。</h2>
        <p>すべてブラウザ内で動作し、入力データは外部へ送信されません。</p>
      </section>
    </main>

    <footer><span>道具箱</span><span>Made for everyday moments.</span></footer>

    <dialog id="tool-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div><p class="eyebrow" id="dialog-category"></p><h2 id="dialog-title"></h2></div>
        <button class="close" id="close-dialog" aria-label="閉じる">×</button>
      </div>
      <div id="tool-content"></div>
    </dialog>
    <template id="text-tool">
      <label class="tool-label" for="text-input">テキストを入力</label>
      <textarea id="text-input" rows="9" placeholder="ここに文章を貼り付けてください"></textarea>
      <div class="stats"><div><strong id="char-count">0</strong><span>文字</span></div><div><strong id="char-no-space">0</strong><span>空白を除く</span></div><div><strong id="line-count">0</strong><span>行</span></div></div>
    </template>
    <template id="image-tool">
      <label class="tool-label" for="image-input">画像を選択（複数可）</label><input id="image-input" type="file" accept="image/*" multiple />
      <label class="tool-label" for="image-width">横幅（px）</label><input id="image-width" type="number" min="100" max="8000" placeholder="画像を選ぶと表示されます" />
      <div class="tool-actions"><button class="primary" id="resize-image">縮小して保存</button></div><p class="result-message" id="image-message" aria-live="polite"></p>
    </template>
    <template id="split-tool">
      <label class="tool-label" for="split-total">合計金額（円）</label><input id="split-total" type="number" min="0" inputmode="numeric" placeholder="例：4800" />
      <label class="tool-label" for="split-people">人数</label><input id="split-people" type="number" min="1" value="2" inputmode="numeric" />
      <div class="tool-actions"><button class="primary" id="calculate-split">計算する</button></div><p class="split-result" id="split-result">金額と人数を入力してください。</p>
    </template>
    <template id="date-tool">
      <label class="tool-label" for="date-start">開始日</label><input id="date-start" type="date" />
      <label class="tool-label" for="date-end">終了日</label><input id="date-end" type="date" />
      <div class="tool-actions"><button class="primary" id="calculate-date">日数を計算</button></div><p class="split-result" id="date-result">2つの日付を選んでください。</p>
    </template>
    <template id="lottery-tool">
      <label class="tool-label" for="lottery-input">候補を1行ずつ入力</label><textarea id="lottery-input" rows="8" placeholder="田中&#10;佐藤&#10;鈴木"></textarea>
      <div class="tool-actions"><button class="primary" id="draw-lottery">1人を選ぶ</button></div><p class="split-result" id="lottery-result">候補を入力して、くじを引いてください。</p>
    </template>
    <template id="teams-tool">
      <label class="tool-label" for="teams-input">名前を1行ずつ入力</label><textarea id="teams-input" rows="8" placeholder="田中&#10;佐藤&#10;鈴木&#10;高橋"></textarea>
      <label class="tool-label" for="teams-count">チーム数</label><input id="teams-count" type="number" min="2" max="20" value="2" inputmode="numeric" />
      <div class="tool-actions"><button class="primary" id="make-teams">チームを作る</button></div><div class="teams-result" id="teams-result">名前とチーム数を入力してください。</div>
    </template>
    <script src="app.js"></script>
  </body>
</html>
